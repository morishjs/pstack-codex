interface:
  display_name: "Codex Delegate"
  short_description: "Execute complete Poteto playbooks through XState evidence gates"
  default_prompt: "Use $codex-delegate: intake the original user request, freeze its delivery goal, and start the matching controller. Apply the configured bug-report-to-PR policy while preserving explicit report-only, plan-only and no-PR restrictions. Drive next/action/record through required completion; investigation completion alone is not PR-task completion. Resume existing goals and evidence. Use real host tools and fresh Sol final review."

policy:
  allow_implicit_invocation: true
