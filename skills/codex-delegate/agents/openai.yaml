interface:
  display_name: "Codex Delegate"
  short_description: "Execute complete Poteto playbooks through XState evidence gates"
  default_prompt: "Use $codex-delegate in the current turn. Keep one worker through all phases and one independent Sol reviewer across revisions; do not create agents merely for phase changes. Preserve every selected playbook gate. Record requirements, findings, fixes and input-hashed checks with team; provide reviewContext on re-review and repair only the responsible stage. Extra source-required participants need an explicit clause and reason. Prefer Terra medium for a selectable new main; preserve existing tasks and authority."

policy:
  allow_implicit_invocation: true
